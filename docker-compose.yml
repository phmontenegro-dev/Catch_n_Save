services:
  postgres:
    image: postgres:16-alpine
    container_name: pkmn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pkmn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pkmn}
      POSTGRES_DB: ${POSTGRES_DB:-pkmn_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pkmn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pkmn} -d ${POSTGRES_DB:-pkmn_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pkmn-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - pkmn_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pkmn_postgres_data:
  pkmn_redis_data:
